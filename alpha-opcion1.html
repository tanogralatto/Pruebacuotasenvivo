<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>TanoApp Alpha · Opción 1: Tarjetas</title>
<!-- ARCHIVO DE PRUEBA: muestra de diseño para la lista de partidos de alpha.html, con partidos inventados. -->
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#252c35;--text:#e8edf2;--muted:#8a96a3;--dim:#5b6672;--acc:#14b8a6;--good:#22c55e;--mid:#eab308;--bad:#ef4444;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.94);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;letter-spacing:.12em;font-size:14px}.brand b{color:var(--acc)}
.tag{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h1{font-size:26px;margin:18px 0 4px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.star{background:none;border:0;color:var(--dim);font-size:19px;padding:0 2px;line-height:1;flex:none}.star.on{color:var(--mid)}
.c-g{color:var(--good)}.c-m{color:var(--mid)}.c-d{color:var(--dim)}
.bg-g{background:var(--good)}.bg-m{background:var(--mid)}.bg-d{background:var(--dim)}
.mono{font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;color:inherit}
.card:active{background:var(--panel2)}
.card .top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.card .top .lg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mid{display:flex;align-items:center;gap:12px}
.card .teams{flex:1;min-width:0;font-size:16px;font-weight:700}
.card .teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .teams .v{font-weight:500;color:var(--muted)}
.ring{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--s)*1%),var(--line) 0)}
.ring b{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--mono);font-size:18px}
.card .bot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.card .hora{font-family:var(--mono);font-size:15px;font-weight:700}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#071014}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">TANO<b>APP</b> · ALPHA</div><span class="tag">Prueba · Opción 1</span></div></header>
<main class="wrap">
  <h1>Partidos</h1>
  <p class="sub">Cada partido en su propia tarjeta, con el puntaje en un círculo. Los partidos y los números son de ejemplo.</p>
  <div id="dList"></div>
</main>
<script>
const PARTIDOS=[
 {h:'16:00',l:'River Plate',v:'Banfield',p:'Argentina',lg:'Liga Profesional',b:'🇦🇷',s:82,f:1},
 {h:'18:15',l:'Racing Club',v:'Lanús',p:'Argentina',lg:'Liga Profesional',b:'🇦🇷',s:58},
 {h:'20:30',l:'Boca Juniors',v:'Talleres',p:'Argentina',lg:'Liga Profesional',b:'🇦🇷',s:27},
 {h:'16:30',l:'Flamengo',v:'Grêmio',p:'Brasil',lg:'Serie A',b:'🇧🇷',s:71},
 {h:'19:00',l:'Palmeiras',v:'Bahia',p:'Brasil',lg:'Serie A',b:'🇧🇷',s:44,f:1},
 {h:'17:00',l:'Sevilla',v:'Real Betis',p:'España',lg:'La Liga',b:'🇪🇸',s:66},
 {h:'17:00',l:'Getafe',v:'Osasuna',p:'España',lg:'La Liga',b:'🇪🇸',s:12},
 {h:'21:00',l:'Atlético Madrid',v:'Villarreal',p:'España',lg:'La Liga',b:'🇪🇸',s:39},
 {h:'16:45',l:'Brighton',v:'Aston Villa',p:'Inglaterra',lg:'Premier League',b:'🇬🇧',s:90},
 {h:'19:30',l:'Everton',v:'Fulham',p:'Inglaterra',lg:'Premier League',b:'🇬🇧',s:null},
 {h:'20:45',l:'Napoli',v:'Atalanta',p:'Italia',lg:'Serie A',b:'🇮🇹',s:53},
 {h:'20:45',l:'Torino',v:'Udinese',p:'Italia',lg:'Serie A',b:'🇮🇹',s:8}
];
const col=s=>s==null?'d':s>=65?'g':s>=35?'m':'d';
const estrella=p=>'<button class="star'+(p.f?' on':'')+'" onclick="event.preventDefault();this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'★\':\'☆\'">'+(p.f?'★':'☆')+'</button>';
const porLiga=()=>{const m=new Map();for(const p of PARTIDOS){const k=p.p+' · '+p.lg;if(!m.has(k))m.set(k,{b:p.b,k,l:[]});m.get(k).l.push(p)}return [...m.values()]};
const txt={g:'Buena oportunidad',m:'Regular',d:'Poco valor'},cv={g:'var(--good)',m:'var(--mid)',d:'var(--dim)'};
document.getElementById('dList').innerHTML='<div class="grid">'+PARTIDOS.map(p=>{const c=col(p.s);
  return '<a class="card" href="#"><div class="top"><span>'+p.b+'</span><span class="lg">'+p.p+' · '+p.lg+'</span>'+estrella(p)+'</div>'
   +'<div class="mid"><div class="teams"><div>'+p.l+'</div><div class="v">vs '+p.v+'</div></div>'
   +'<div class="ring" style="--s:'+(p.s??0)+';--c:'+cv[c]+'"><b class="c-'+c+'">'+(p.s??'–')+'</b></div></div>'
   +'<div class="bot"><span class="hora">'+p.h+'</span>'+(p.s==null?'<span class="c-d">Sin análisis</span>':'<span class="pill bg-'+c+'">'+txt[c]+'</span>')+'</div></a>'}).join('')+'</div>';
</script>
</body>
</html>

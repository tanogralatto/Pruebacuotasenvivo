name: Tests Poisson y backtest

on:
  pull_request:
    paths:
      - 'modelo-poisson.js'
      - 'backtest-poisson.js'
      - 'modelo-xg.js'
      - 'tests/**'
      - '.github/workflows/test-backtest.yml'
  push:
    branches: [main]
    paths:
      - 'modelo-poisson.js'
      - 'backtest-poisson.js'
      - 'modelo-xg.js'
      - 'tests/**'
      - '.github/workflows/test-backtest.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/xg-backtest.test.js tests/modelo-poisson.test.js

# Renueva data/fd-1x2.json (cuotas de cierre 1X2 de football-data.co.uk) para alpha.html.
# No usa ninguna clave. Corre los lunes y se puede lanzar a mano desde la pestaña Actions.
name: Cuotas históricas (football-data)
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/football-data.js
      - name: Guardar si cambió
        run: |
          git config user.name "tanoapp-bot"
          git config user.email "tanoapp-bot@users.noreply.github.com"
          git add data/fd-1x2.json
          git diff --cached --quiet || (git commit -m "Cuotas históricas actualizadas (football-data.co.uk)" && git push)

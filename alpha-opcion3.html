<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>TanoApp Alpha · Opción 3: Lista con colores</title>
<!-- ARCHIVO DE PRUEBA: muestra de diseño para la lista de partidos de alpha.html, con partidos inventados. -->
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#252c35;--text:#e8edf2;--muted:#8a96a3;--dim:#5b6672;--acc:#14b8a6;--good:#22c55e;--mid:#eab308;--bad:#ef4444;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.94);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;letter-spacing:.12em;font-size:14px}.brand b{color:var(--acc)}
.tag{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h1{font-size:26px;margin:18px 0 4px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.star{background:none;border:0;color:var(--dim);font-size:19px;padding:0 2px;line-height:1;flex:none}.star.on{color:var(--mid)}
.c-g{color:var(--good)}.c-m{color:var(--mid)}.c-d{color:var(--dim)}
.bg-g{background:var(--good)}.bg-m{background:var(--mid)}.bg-d{background:var(--dim)}
.mono{font-family:var(--mono)}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-weight:700;font-size:14px}
.sec .dot{width:10px;height:10px;border-radius:50%}
.sec .n{color:var(--dim);font-weight:500;font-size:13px}
.fx{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;margin:6px 0;text-decoration:none;color:inherit;background:linear-gradient(90deg,var(--t),var(--panel) 55%)}
.fx .sc{flex:none;width:44px;text-align:center;font-family:var(--mono);font-size:24px;font-weight:800;color:var(--c);line-height:1}
.fx .sc small{display:block;font:500 10px/1.3 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--muted);margin-top:3px}
.fx .teams{flex:1;min-width:0}
.fx .teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .teams .a{font-weight:700}
.fx .teams .dl{font-size:12.5px;color:var(--muted);margin-top:2px}
.fx .hora{flex:none;font-family:var(--mono);font-size:13px;color:var(--muted)}
.g{--c:var(--good);--t:rgba(34,197,94,.16)}.m{--c:var(--mid);--t:rgba(234,179,8,.13)}.d{--c:var(--dim);--t:rgba(91,102,114,.10)}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">TANO<b>APP</b> · ALPHA</div><span class="tag">Prueba · Opción 3</span></div></header>
<main class="wrap">
  <h1>Partidos</h1>
  <p class="sub">Los mejores partidos arriba, separados por color. Los partidos y los números son de ejemplo.</p>
  <div id="dList"></div>
</main>
<script>
const PARTIDOS=[
 {h:'16:00',l:'River Plate',v:'Banfield',p:'Argentina',lg:'Liga Profesional',b:'🇦🇷',s:82,f:1},
 {h:'18:15',l:'Racing Club',v:'Lanús',p:'Argentina',lg:'Liga Profesional',b:'🇦🇷',s:58},
 {h:'20:30',l:'Boca Juniors',v:'Talleres',p:'Argentina',lg:'Liga Profesional',b:'🇦🇷',s:27},
 {h:'16:30',l:'Flamengo',v:'Grêmio',p:'Brasil',lg:'Serie A',b:'🇧🇷',s:71},
 {h:'19:00',l:'Palmeiras',v:'Bahia',p:'Brasil',lg:'Serie A',b:'🇧🇷',s:44,f:1},
 {h:'17:00',l:'Sevilla',v:'Real Betis',p:'España',lg:'La Liga',b:'🇪🇸',s:66},
 {h:'17:00',l:'Getafe',v:'Osasuna',p:'España',lg:'La Liga',b:'🇪🇸',s:12},
 {h:'21:00',l:'Atlético Madrid',v:'Villarreal',p:'España',lg:'La Liga',b:'🇪🇸',s:39},
 {h:'16:45',l:'Brighton',v:'Aston Villa',p:'Inglaterra',lg:'Premier League',b:'🇬🇧',s:90},
 {h:'19:30',l:'Everton',v:'Fulham',p:'Inglaterra',lg:'Premier League',b:'🇬🇧',s:null},
 {h:'20:45',l:'Napoli',v:'Atalanta',p:'Italia',lg:'Serie A',b:'🇮🇹',s:53},
 {h:'20:45',l:'Torino',v:'Udinese',p:'Italia',lg:'Serie A',b:'🇮🇹',s:8}
];
const col=s=>s==null?'d':s>=65?'g':s>=35?'m':'d';
const estrella=p=>'<button class="star'+(p.f?' on':'')+'" onclick="event.preventDefault();this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'★\':\'☆\'">'+(p.f?'★':'☆')+'</button>';
const porLiga=()=>{const m=new Map();for(const p of PARTIDOS){const k=p.p+' · '+p.lg;if(!m.has(k))m.set(k,{b:p.b,k,l:[]});m.get(k).l.push(p)}return [...m.values()]};
const SEC=[['g','Buenas oportunidades','65 o más'],['m','Regulares','35 a 64'],['d','Poco valor','menos de 35']];
const ord=[...PARTIDOS].sort((x,y)=>(y.s??-1)-(x.s??-1));
document.getElementById('dList').innerHTML=SEC.map(([c,t,r])=>{const l=ord.filter(p=>col(p.s)===c);if(!l.length)return '';
 return '<div class="sec"><span class="dot bg-'+c+'"></span>'+t+' <span class="n">· '+r+' · '+l.length+' partidos</span></div>'
  +l.map(p=>'<a class="fx '+c+'" href="#"><span class="sc">'+(p.s??'–')+'<small>'+(p.s==null?'sin dato':'score')+'</small></span>'
   +'<span class="teams"><div class="a">'+p.l+' <span class="c-d" style="font-weight:500">vs</span> '+p.v+'</div><div class="dl">'+p.b+' '+p.p+' · '+p.lg+'</div></span>'
   +'<span class="hora">'+p.h+'</span>'+estrella(p)+'</a>').join('')}).join('');
</script>
</body>
</html>
